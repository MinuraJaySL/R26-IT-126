# Checks the GreenSweep mobile app (mobile_app/) on pull requests to main:
# code analysis and the tests in mobile_app/test. It only reads the code —
# nothing is built for release or deployed — and it does not run for pull
# requests that leave mobile_app/ untouched.
name: Mobile app checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'mobile_app/**'
      - '.github/workflows/mobile-app.yml'

permissions:
  contents: read

# A new push to the same pull request replaces the run still in progress.
concurrency:
  group: mobile-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile_app
    steps:
      - uses: actions/checkout@v4

      # Same Flutter version the app is developed with.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.9'
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
