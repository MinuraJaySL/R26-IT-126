name = "greensweep-verification-worker"
main = "src/index.ts"
compatibility_date = "2024-11-01"

# Non-secret configuration. Real values are set with:
#   wrangler secret put FIREBASE_SERVICE_ACCOUNT_KEY
#   wrangler secret put EMAILJS_PRIVATE_KEY
# Secrets must NOT be listed here — [vars] is plaintext in wrangler.toml.
[vars]
FIREBASE_PROJECT_ID = "r26-it-126-waste-app"
FIREBASE_WEB_API_KEY = ""
EMAILJS_SERVICE_ID = ""
EMAILJS_TEMPLATE_ID = ""
EMAILJS_PUBLIC_KEY = ""
